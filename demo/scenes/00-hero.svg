  <text x="72" y="190" fill="#d7ff63" font-family="SF Mono,Menlo,monospace" font-size="82" font-weight="700">METRA</text>
  <text x="76" y="248" fill="#eef5ec" font-family="Avenir Next,Helvetica,sans-serif" font-size="36">metadata workflows, with evidence</text>
  <text x="76" y="304" fill="#9ab6b0" font-family="Avenir Next,Helvetica,sans-serif" font-size="22">A local-first Rust toolkit to read, validate, create, compare, and safely edit.</text>
