  <circle cx="108" cy="406" r="7" fill="#ff7d66"/><circle cx="134" cy="406" r="7" fill="#f4bd5b"/><circle cx="160" cy="406" r="7" fill="#d7ff63"/>
  <text x="108" y="458" fill="#d7ff63" font-family="SF Mono,Menlo,monospace" font-size="24">$ ./metra --jsonl take.wav</text>
  <text x="108" y="502" fill="#e9f1e8" font-family="SF Mono,Menlo,monospace" font-size="23">{"format":"WAV", "tags":9, "warnings":0}</text>
