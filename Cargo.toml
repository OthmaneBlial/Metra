[package]
name = "metra"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rust-native local-first metadata toolkit for safe read, write, create, validate, copy, and compare workflows"
homepage = "https://othmaneblial.github.io/Metra/"
license = "MIT"
readme = "README.md"
repository = "https://github.com/OthmaneBlial/Metra"
keywords = ["metadata", "exif", "jpeg", "tiff", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[workspace]
members = [
    ".",
    "crates/metra-core",
    "crates/metra-formats",
]
resolver = "3"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
metra-core = { path = "crates/metra-core" }
metra-formats = { path = "crates/metra-formats" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "throughput"
harness = false

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
quick-xml = "0.38"
flate2 = "1.1"
serde_yaml = "0.9"
toml = "0.9"
